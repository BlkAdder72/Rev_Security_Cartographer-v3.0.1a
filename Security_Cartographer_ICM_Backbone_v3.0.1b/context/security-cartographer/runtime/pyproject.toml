[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-cartographer"
version = "3.0.1b"
description = "ICM-native trust mapper and fail-closed reference monitor for agent workflows"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
security-cartographer = "security_cartographer:main"

[tool.setuptools]
py-modules = ["security_cartographer", "icm_runtime_adapter"]

